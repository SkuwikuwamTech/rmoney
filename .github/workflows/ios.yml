name: Build iOS Mobile App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Install Rust stable & iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Prepare Tauri Config for Mobile
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            delete conf.plugins?.updater;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2));
          "

      - name: Initialize Tauri iOS project
        run: npx tauri ios init --ci

      - name: Build iOS App (Simulator Target)
        run: npx tauri ios build --target aarch64-sim --ci

      - name: Upload iOS Simulator App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: rmoney-ios-simulator-app
          path: src-tauri/gen/apple/**/*.app
          if-no-files-found: warn

      - name: Build iOS Physical Device App (Unsigned)
        shell: bash
        run: |
          # Build Rust iOS aarch64 binary and Xcode project
          npx tauri ios build --target aarch64 --ci --no-watch || true
          
          # If standard tauri build exited due to signing requirements, build unsigned .app via xcodebuild
          if [ -d "src-tauri/gen/apple" ]; then
            xcodebuild -project src-tauri/gen/apple/*.xcodeproj \
              -scheme $(xcodebuild -project src-tauri/gen/apple/*.xcodeproj -list | grep -E "rmoney|rMoney" | head -n 1 | tr -d ' ') \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              build || true
          fi

      - name: Package Unsigned IPA for Sideloading
        shell: bash
        run: |
          mkdir -p release-ipa/Payload
          APP_PATH=$(find src-tauri/gen/apple -name "*.app" -type d | grep -v "Simulator" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find src-tauri/gen/apple -name "*.app" -type d | head -n 1)
          fi
          echo "Found iOS app at: $APP_PATH"
          if [ -n "$APP_PATH" ]; then
            cp -r "$APP_PATH" release-ipa/Payload/
            cd release-ipa
            zip -r rMoney-iOS-unsigned.ipa Payload
            cd ..
          fi

      - name: Upload Unsigned iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmoney-ios-device-ipa
          path: release-ipa/*.ipa
          if-no-files-found: warn

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-ipa/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
