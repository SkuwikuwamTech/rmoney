name: Build iOS Mobile App

# Manual trigger only for now while iOS is on hold
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach IPA to (e.g. v1.0.14)'
        required: false
        default: 'v1.0.14'

jobs:
  build-ios:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Verify Xcode Version
        run: |
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch || true

      - name: Install Rust stable & iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,x86_64-apple-ios

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Setup Environment Symlinks for Xcode Script Phases
        shell: bash
        run: |
          sudo mkdir -p /usr/local/bin /opt/homebrew/bin || true
          for bin in node npm npx cargo rustc rustup; do
            p=$(which $bin 2>/dev/null || echo "")
            if [ -n "$p" ]; then
              sudo ln -sf "$p" /usr/local/bin/$bin || true
              sudo ln -sf "$p" /opt/homebrew/bin/$bin || true
            fi
          done

      - name: Build Web Frontend
        run: npm run build

      - name: Prepare Tauri Config for Mobile
        run: node scripts/prepare-mobile-config.js

      - name: Precompile Rust Static Library for iOS Device
        run: cargo build --release --target aarch64-apple-ios --manifest-path src-tauri/Cargo.toml

      - name: Initialize Tauri iOS project
        run: npx tauri ios init --ci

      - name: Patch Xcode Project for Unsigned Build and Environment
        shell: bash
        run: |
          node scripts/patch-ios-project.js
          plutil -lint src-tauri/gen/apple/*.xcodeproj/project.pbxproj

      - name: Build iOS Physical Device App (Unsigned)
        shell: bash
        run: |
          echo "Locating Xcode project..."
          XCODEPROJ=$(find src-tauri/gen/apple -name "*.xcodeproj" | head -n 1)
          echo "Found project: $XCODEPROJ"

          # Determine scheme name
          SCHEME=$(xcodebuild -project "$XCODEPROJ" -list | grep -E "_iOS|rMoney|rmoney" | head -n 1 | tr -d ' ')
          echo "Using scheme: $SCHEME"

          # Build physical device app directly to a local derivedDataPath
          xcodebuild build \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/derivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM=""

      - name: Package and Validate Unsigned IPA for Sideloading
        shell: bash
        run: |
          mkdir -p release-ipa/Payload

          # Find the built .app in the iphoneos products directory
          APP_BUNDLE=$(find build/derivedData/Build/Products/Release-iphoneos -name "*.app" -type d | head -n 1)

          if [ -z "$APP_BUNDLE" ]; then
            echo "::error::No iOS physical device .app bundle found in Release-iphoneos!"
            find build/derivedData -name "*.app" || true
            exit 1
          fi

          echo "Found compiled physical device app bundle at: $APP_BUNDLE"

          # Verify platform from Info.plist
          PLATFORM=$(plutil -extract DTPlatformName raw "$APP_BUNDLE/Info.plist" 2>/dev/null || echo "unknown")
          echo "Detected DTPlatformName: $PLATFORM"
          if [ "$PLATFORM" != "iphoneos" ]; then
            echo "::error::CRITICAL: Platform is '$PLATFORM', expected 'iphoneos'!"
            exit 1
          fi

          # Verify Mach-O platform and architecture
          BINARY=$(find "$APP_BUNDLE" -maxdepth 1 -type f -perm +111 | head -n 1)
          if [ -n "$BINARY" ]; then
            echo "Inspecting binary: $BINARY"
            otool -hv "$BINARY" || true
            otool -l "$BINARY" | grep -A 4 "LC_BUILD_VERSION" || true
          fi

          # Copy into Payload and package IPA
          cp -r "$APP_BUNDLE" release-ipa/Payload/
          cd release-ipa
          zip -r rMoney-iOS-unsigned.ipa Payload
          cd ..

          echo "Final IPA packaged successfully:"
          ls -lh release-ipa/rMoney-iOS-unsigned.ipa
          unzip -l release-ipa/rMoney-iOS-unsigned.ipa | head -n 30

      - name: Upload Unsigned iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmoney-ios-device-ipa
          path: release-ipa/*.ipa
          if-no-files-found: error

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name || 'v1.0.7' }}
          files: release-ipa/*.ipa
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
