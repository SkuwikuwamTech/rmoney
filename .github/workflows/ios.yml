name: Build iOS Mobile App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach IPA to (e.g. v1.0.6)'
        required: false
        default: 'v1.0.6'

jobs:
  build-ios:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Verify Xcode Version
        run: |
          xcodebuild -version
          sudo xcodebuild -runFirstLaunch || true

      - name: Install Rust stable & iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Setup Environment Symlinks for Xcode Script Phases
        shell: bash
        run: |
          sudo mkdir -p /usr/local/bin /opt/homebrew/bin || true
          for bin in node npm npx cargo rustc rustup; do
            p=$(which $bin 2>/dev/null || echo "")
            if [ -n "$p" ]; then
              sudo ln -sf "$p" /usr/local/bin/$bin || true
              sudo ln -sf "$p" /opt/homebrew/bin/$bin || true
            fi
          done

      - name: Build Web Frontend
        run: npm run build

      - name: Prepare Tauri Config for Mobile
        run: node scripts/prepare-mobile-config.js

      - name: Precompile Rust Static Library for iOS Device
        run: cargo build --release --target aarch64-apple-ios --manifest-path src-tauri/Cargo.toml

      - name: Initialize Tauri iOS project
        run: npx tauri ios init --ci

      - name: Patch Xcode Project for Unsigned Build and Environment
        shell: bash
        run: |
          node scripts/patch-ios-project.js
          plutil -lint src-tauri/gen/apple/*.xcodeproj/project.pbxproj

      - name: Build iOS Physical Device App via Tauri CLI
        shell: bash
        run: |
          echo "Building iOS physical device target (aarch64) with Tauri CLI..."
          npx tauri ios build --target aarch64 --ci --verbose -- \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO

      - name: Package and Validate Unsigned IPA for Sideloadly / AltStore
        shell: bash
        run: |
          mkdir -p release-ipa/Payload

          # 1. Check if Tauri already exported a physical device IPA
          EXISTING_IPA=$(find src-tauri/gen/apple/build -name "*.ipa" -type f | grep -v -i "simulator" | head -n 1)
          if [ -n "$EXISTING_IPA" ]; then
            echo "Found Tauri exported device IPA at: $EXISTING_IPA"
            cp "$EXISTING_IPA" release-ipa/rMoney-iOS-unsigned.ipa
          fi

          # 2. If no pre-packaged IPA, package from the device .app bundle
          if [ ! -f "release-ipa/rMoney-iOS-unsigned.ipa" ]; then
            APP_BUNDLE=$(find src-tauri/gen/apple -name "*.app" -type d | grep -v -i "simulator" | head -n 1)

            if [ -z "$APP_BUNDLE" ]; then
              echo "::error::No iOS physical device .app bundle or .ipa found!"
              find src-tauri/gen/apple || true
              exit 1
            fi

            echo "Found iOS physical device app bundle at: $APP_BUNDLE"

            # Verify platform from Info.plist
            if [ -f "$APP_BUNDLE/Info.plist" ]; then
              PLATFORM=$(plutil -extract DTPlatformName raw "$APP_BUNDLE/Info.plist" 2>/dev/null || true)
              echo "Detected DTPlatformName: $PLATFORM"
              if [ "$PLATFORM" = "iphonesimulator" ]; then
                echo "::error::CRITICAL: Found iphonesimulator build instead of iphoneos!"
                exit 1
              fi
            fi

            # Copy into Payload and zip into IPA
            cp -r "$APP_BUNDLE" release-ipa/Payload/
            cd release-ipa
            zip -r "rMoney-iOS-unsigned.ipa" Payload
            cd ..
          fi

          echo "Final IPA ready for distribution:"
          ls -lh release-ipa/rMoney-iOS-unsigned.ipa
          unzip -l release-ipa/rMoney-iOS-unsigned.ipa | head -n 25

      - name: Upload Unsigned iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmoney-ios-device-ipa
          path: release-ipa/*.ipa
          if-no-files-found: error

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name || 'v1.0.6' }}
          files: release-ipa/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
