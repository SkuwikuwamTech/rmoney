name: Build iOS Mobile App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach IPA to (e.g. v1.0.6)'
        required: false
        default: 'v1.0.6'

jobs:
  build-ios:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Verify Xcode Version
        run: xcodebuild -version

      - name: Install Rust stable & iOS targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Setup Environment Symlinks for Xcode Script Phases
        shell: bash
        run: |
          sudo ln -sf $(which node) /usr/local/bin/node || true
          sudo ln -sf $(which npm) /usr/local/bin/npm || true
          sudo ln -sf $(which npx) /usr/local/bin/npx || true
          sudo ln -sf $HOME/.cargo/bin/cargo /usr/local/bin/cargo || true
          sudo ln -sf $HOME/.cargo/bin/rustc /usr/local/bin/rustc || true

      - name: Build Web Frontend
        run: npm run build

      - name: Prepare Tauri Config for Mobile
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            delete conf.plugins?.updater;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2));
          "

      - name: Precompile Rust Static Library for iOS Device
        run: cargo build --release --target aarch64-apple-ios --manifest-path src-tauri/Cargo.toml

      - name: Initialize Tauri iOS project
        run: npx tauri ios init --ci

      - name: Patch Xcode Project for Unsigned Build
        shell: bash
        run: |
          find src-tauri/gen/apple -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' {} + || true
          find src-tauri/gen/apple -name "project.pbxproj" -exec sed -i '' 's/DevelopmentTeam = [^;]*;/DevelopmentTeam = "";/g' {} + || true
          find src-tauri/gen/apple -name "project.pbxproj" -exec sed -i '' 's/CODE_SIGN_IDENTITY = [^;]*;/CODE_SIGN_IDENTITY = "";/g' {} + || true

      - name: Build iOS Physical Device App (Unsigned)
        shell: bash
        run: |
          PROJ_PATH=$(find src-tauri/gen/apple -name "*.xcodeproj" -maxdepth 1 | head -n 1)
          echo "Xcode Project found at: $PROJ_PATH"
          xcodebuild -project "$PROJ_PATH" -list

          SCHEME=$(xcodebuild -project "$PROJ_PATH" -list | grep -E "rMoney_iOS|rmoney_iOS|_iOS" | head -n 1 | tr -d ' ')
          if [ -z "$SCHEME" ]; then
            SCHEME=$(xcodebuild -project "$PROJ_PATH" -list | grep -E "rMoney|rmoney" | head -n 1 | tr -d ' ')
          fi
          echo "Building Scheme: $SCHEME for physical iOS device (iphoneos SDK)"

          mkdir -p src-tauri/gen/apple/build

          # Attempt archive first
          xcodebuild archive \
            -project "$PROJ_PATH" \
            -scheme "$SCHEME" \
            -archivePath "src-tauri/gen/apple/build/rMoney.xcarchive" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" || true

          # If xcarchive wasn't produced, fallback to direct xcodebuild
          if [ ! -d "src-tauri/gen/apple/build/rMoney.xcarchive" ]; then
            echo "Falling back to xcodebuild build with iphoneos SDK..."
            xcodebuild -project "$PROJ_PATH" \
              -scheme "$SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "src-tauri/gen/apple/build" \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGNING_ALLOWED=NO \
              DEVELOPMENT_TEAM="" \
              build
          fi

      - name: Package and Validate Unsigned IPA for Sideloadly / AltStore
        shell: bash
        run: |
          mkdir -p release-ipa/Payload

          # Search for .app bundle strictly excluding any simulator artifacts
          APP_BUNDLE=$(find src-tauri/gen/apple/build -name "*.app" -type d | grep -v -i "simulator" | head -n 1)

          if [ -z "$APP_BUNDLE" ]; then
            echo "::error::No iOS physical device .app bundle found!"
            find src-tauri/gen/apple/build || true
            exit 1
          fi

          echo "Found iOS physical device app at: $APP_BUNDLE"

          # Verify platform from Info.plist
          if [ -f "$APP_BUNDLE/Info.plist" ]; then
            PLATFORM=$(plutil -extract DTPlatformName raw "$APP_BUNDLE/Info.plist" 2>/dev/null || true)
            echo "Detected DTPlatformName: $PLATFORM"
            if [ "$PLATFORM" = "iphonesimulator" ]; then
              echo "::error::CRITICAL: The built app is for iphonesimulator, NOT iphoneos!"
              exit 1
            fi
          fi

          # Copy into Payload and zip into IPA
          cp -r "$APP_BUNDLE" release-ipa/Payload/
          cd release-ipa
          zip -r "rMoney-iOS-unsigned.ipa" Payload
          cd ..

          echo "Successfully created IPA:"
          ls -lh release-ipa/rMoney-iOS-unsigned.ipa

      - name: Upload Unsigned iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmoney-ios-device-ipa
          path: release-ipa/*.ipa
          if-no-files-found: error

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name || 'v1.0.6' }}
          files: release-ipa/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
