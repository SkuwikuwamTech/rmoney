name: Build Android Mobile APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag to attach APK to (e.g. v1.0.15)'
        required: false
        default: 'v1.0.15'

jobs:
  build-android:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b
          add-to-path: true

      - name: Configure Android SDK Environment
        shell: bash
        run: |
          ANDROID_HOME="/usr/local/lib/android/sdk"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${{ steps.setup-ndk.outputs.ndk-path }}" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          # Accept SDK licenses
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Rust stable & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm install

      - name: Build Web Frontend
        run: npm run build

      - name: Prepare Tauri Config for Mobile
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const conf = JSON.parse(fs.readFileSync('src-tauri/tauri.conf.json', 'utf8'));
            delete conf.plugins?.updater;
            fs.writeFileSync('src-tauri/tauri.conf.json', JSON.stringify(conf, null, 2));
          "

      - name: Initialize Tauri Android project
        run: npx tauri android init

      - name: Apply rMoney App Icons to Android Native Project
        shell: bash
        run: |
          echo "Updating Android launcher icons from app-icon.svg..."
          npx tauri icon app-icon.svg
          
          echo "Copying icon mipmaps to Android native res directory..."
          mkdir -p src-tauri/gen/android/app/src/main/res
          cp -r src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/
          
          # Verify mipmap files exist
          ls -la src-tauri/gen/android/app/src/main/res/mipmap-xxhdpi/

      - name: Build Android APK (Release)
        run: npx tauri android build --apk --target aarch64 --target x86_64 --ci

      - name: Locate Android Build Tools
        id: build-tools
        shell: bash
        run: |
          BUILD_TOOLS_DIR=$(find $ANDROID_HOME/build-tools -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          echo "BUILD_TOOLS_DIR=$BUILD_TOOLS_DIR" >> $GITHUB_ENV
          echo "Using Android Build-Tools from: $BUILD_TOOLS_DIR"

      - name: Align and Sign Release APK
        shell: bash
        run: |
          # 1. Locate the generated raw release APK
          RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$RAW_APK" ]; then
            echo "::error::No release APK found in src-tauri/gen/android/app/build/outputs/apk!"
            find src-tauri/gen/android -name "*.apk" || true
            exit 1
          fi
          echo "Found raw release APK at: $RAW_APK"

          mkdir -p release-apk
          ALIGNED_APK="release-apk/rMoney-aligned.apk"
          FINAL_APK="release-apk/rMoney-v1-universal.apk"

          # 2. 4-byte ZipAlign the APK
          $BUILD_TOOLS_DIR/zipalign -f -v -p 4 "$RAW_APK" "$ALIGNED_APK"

          # 3. Setup Keystore
          KEYSTORE_FILE="scripts/release.keystore"
          if [ -n "${{ secrets.ANDROID_SIGNING_KEY }}" ]; then
            echo "Using repository signing key secret..."
            echo "${{ secrets.ANDROID_SIGNING_KEY }}" | base64 --decode > "$KEYSTORE_FILE"
            KEYSTORE_PASS="${{ secrets.ANDROID_KEY_STORE_PASSWORD }}"
            KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}"
            KEY_PASS="${{ secrets.ANDROID_KEY_PASSWORD }}"
          elif [ -f "$KEYSTORE_FILE" ]; then
            echo "Using existing repository release keystore at: $KEYSTORE_FILE"
            KEYSTORE_PASS="rmoneyapp"
            KEY_ALIAS="rmoney"
            KEY_PASS="rmoneyapp"
          else
            echo "Generating persistent release keystore for distribution..."
            mkdir -p scripts
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_FILE" \
              -alias rmoney \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass rmoneyapp \
              -keypass rmoneyapp \
              -dname "CN=rMoney, OU=Mobile, O=SkuwikuwamTech, C=US"
            KEYSTORE_PASS="rmoneyapp"
            KEY_ALIAS="rmoney"
            KEY_PASS="rmoneyapp"

            # Commit the keystore back to the repo so all future builds share the identical signature
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add "$KEYSTORE_FILE"
            git commit -m "chore: persist release signing keystore for continuous Android updates [skip ci]" || true
            git push origin HEAD:main || true
          fi

          # 4. Sign the APK using apksigner with v1, v2, and v3 schemes
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks "$KEYSTORE_FILE" \
            --ks-pass pass:"$KEYSTORE_PASS" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASS" \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL_APK" \
            "$ALIGNED_APK"

          # 5. Verify the APK signature thoroughly
          echo "Verifying signed APK with apksigner:"
          $BUILD_TOOLS_DIR/apksigner verify -v --print-certs "$FINAL_APK"

          rm -f "$ALIGNED_APK"
          echo "Final Signed APK ready:"
          ls -lh "$FINAL_APK"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: rmoney-android-apk
          path: release-apk/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.tag_name || 'v1.0.8' }}
          files: release-apk/*.apk
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
