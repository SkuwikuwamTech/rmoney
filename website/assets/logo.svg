<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background rounded square gradient: blue-700 via blue-600 to indigo-500 -->
    <linearGradient id="emblemGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Subtle inner border gradient -->
    <linearGradient id="borderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.10" />
    </linearGradient>

    <!-- Drop shadow for the badge -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Drop shadow for inner glyphs -->
    <filter id="glyphShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded Square Body with shadow -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#emblemGradient)" />
  <!-- Inner Highlight Ring -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="url(#borderGradient)" stroke-width="4" />

  <!-- Lowercase 'r' in Calibri Bold Italic styled typography -->
  <g filter="url(#glyphShadow)">
    <text
      x="244"
      y="346"
      text-anchor="middle"
      fill="#ffffff"
      font-family="Calibri, 'Segoe UI', Candara, sans-serif"
      font-weight="bold"
      font-style="italic"
      font-size="340"
      letter-spacing="-10"
    >r</text>
  </g>

  <!-- Bottom-Right Dollar Badge ($) -->
  <!-- Badge container: dark slate circle with subtle border and drop shadow -->
  <g filter="url(#badgeShadow)">
    <circle cx="410" cy="410" r="82" fill="#0f172a" stroke="#1e293b" stroke-width="6" />
    <circle cx="410" cy="410" r="82" fill="#0f172a" fill-opacity="0.95" />
    <!-- Dollar sign glyph -->
    <text
      x="410"
      y="450"
      text-anchor="middle"
      fill="#6ee7b7"
      font-family="Calibri, 'Segoe UI', Candara, sans-serif"
      font-weight="bold"
      font-style="italic"
      font-size="124"
    >$</text>
  </g>
</svg>
