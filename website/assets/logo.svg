<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Primary Gradients -->
    <linearGradient id="bearDenGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="denArch" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.4" />
    </linearGradient>
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Protective Outer Den (Sanctuary Arch / Cave Shelter) -->
  <path d="M 60 12 C 30 12 16 35 16 68 C 16 95 34 108 60 108 C 86 108 104 95 104 68 C 104 35 90 12 60 12 Z" 
        fill="url(#denArch)" 
        stroke="url(#bearDenGlow)" 
        stroke-width="2.5" 
        stroke-linejoin="round" />

  <!-- Mountain Peak / Den Ceiling Facets -->
  <path d="M 60 18 L 86 64 L 60 52 L 34 64 Z" 
        fill="#4338ca" 
        fill-opacity="0.35" />

  <!-- Bear Silhouette: Noble, Vigilant Bear Facing Right (Geometric / Stylized Sovereign Mascot) -->
  <!-- Bear Head & Back Silhouette -->
  <path d="M 38 88 C 38 74 42 63 50 56 C 54 52 56 46 54 41 C 52 36 55 33 59 34 C 62 35 63 38 62 42 C 67 43 72 45 78 48 C 84 51 93 54 96 61 C 98 65 95 69 90 70 C 86 71 83 72 82 76 C 81 80 82 85 82 88 Z" 
        fill="url(#bearDenGlow)" 
        filter="url(#subtleGlow)" />

  <!-- Bear Ear Detail -->
  <path d="M 54 41 C 53 37 56 34 59 35 C 61 36 61 39 59 42 Z" 
        fill="#a5b4fc" />

  <!-- Bear Muzzle & Jaw Structure -->
  <path d="M 78 48 L 96 61 C 98 65 95 69 90 70 L 76 68 Z" 
        fill="#818cf8" 
        fill-opacity="0.9" />

  <!-- Bear Nose / Vigilant Eye Accent -->
  <circle cx="73" cy="53" r="2.2" fill="#ffffff" />
  <circle cx="73" cy="53" r="1.2" fill="#312e81" />
  <circle cx="94" cy="62" r="2" fill="#1e1b4b" />

  <!-- The "Sanctuary Hearth" / Protected Inner Core (Gold ember inside the den) -->
  <path d="M 60 76 L 68 88 L 52 88 Z" 
        fill="url(#goldAccent)" 
        opacity="0.9" />
  <circle cx="60" cy="80" r="2" fill="#ffffff" opacity="0.8" />

  <!-- Bottom Den Foundation Base Line -->
  <path d="M 32 94 C 44 98 76 98 88 94" 
        stroke="url(#bearDenGlow)" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.6" />
</svg>
