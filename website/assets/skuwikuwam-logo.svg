<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Sovereign Indigo & Violet Gradients -->
    <linearGradient id="bearDenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>

    <linearGradient id="bearEarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#c7d2fe" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="denSanctuaryGlow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="60%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <linearGradient id="shieldFrameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#312e81" stop-opacity="0.9" />
    </linearGradient>

    <!-- Subtle Drop Glow Filter -->
    <filter id="bearGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Sanctuary Shield / Den Arch Outer Contour -->
  <path d="M 60 8 C 28 8 16 28 16 58 C 16 88 36 108 60 114 C 84 108 104 88 104 58 C 104 28 92 8 60 8 Z" 
        fill="#0b0f19" 
        stroke="url(#shieldFrameGrad)" 
        stroke-width="2.5" />

  <!-- Mountain Peak / Cave Roof Structure in Background -->
  <path d="M 60 14 L 94 62 L 60 50 L 26 62 Z" 
        fill="#4338ca" 
        fill-opacity="0.25" />

  <!-- Bear Ears (Distinct Round Bear Ears) -->
  <!-- Left Outer Ear -->
  <path d="M 33 42 C 22 42 18 28 29 20 C 39 13 47 24 43 36 Z" 
        fill="url(#bearDenGrad)" />
  <!-- Left Inner Ear -->
  <path d="M 33 37 C 27 37 25 28 31 23 C 37 19 41 27 38 33 Z" 
        fill="url(#bearEarGrad)" />

  <!-- Right Outer Ear -->
  <path d="M 87 42 C 98 42 102 28 91 20 C 81 13 73 24 77 36 Z" 
        fill="url(#bearDenGrad)" />
  <!-- Right Inner Ear -->
  <path d="M 87 37 C 93 37 95 28 89 23 C 83 19 79 27 82 33 Z" 
        fill="url(#bearEarGrad)" />

  <!-- Main Bear Head / Silhouette (Guardian Bear of the Den) -->
  <path d="M 40 32 C 48 30 72 30 80 32 C 86 33 93 42 96 52 C 99 64 97 76 89 83 C 85 86 82 94 77 98 C 69 103 51 103 43 98 C 38 94 35 86 31 83 C 23 76 21 64 24 52 C 27 42 34 33 40 32 Z" 
        fill="url(#bearDenGrad)" 
        filter="url(#bearGlow)" />

  <!-- Bear Cheek & Brow Facets (Geometric Modernism) -->
  <!-- Left Brow / Cheek -->
  <path d="M 40 34 L 28 53 L 42 62 L 48 48 Z" 
        fill="#a5b4fc" 
        fill-opacity="0.35" />
  <!-- Right Brow / Cheek -->
  <path d="M 80 34 L 92 53 L 78 62 L 72 48 Z" 
        fill="#4338ca" 
        fill-opacity="0.4" />

  <!-- Bear Eyes (Watchful, Calm Sovereign Eyes) -->
  <!-- Left Eye -->
  <polygon points="41,50 49,52 47,55 39,53" fill="#ffffff" />
  <!-- Right Eye -->
  <polygon points="79,50 71,52 73,55 81,53" fill="#ffffff" />

  <!-- Bear Muzzle / Snout (Pronounced Bear Feature) -->
  <path d="M 46 60 C 46 54 74 54 74 60 C 76 72 74 84 68 87 C 64 89 56 89 52 87 C 46 84 44 72 46 60 Z" 
        fill="#e0e7ff" />

  <!-- Bear Nose (Solid, Broad, Iconic Bear Nose) -->
  <path d="M 52 64 C 54 62 66 62 68 64 C 70 67 69 72 60 74 C 51 72 50 67 52 64 Z" 
        fill="#1e1b4b" />
  <circle cx="56" cy="65" r="1" fill="#818cf8" opacity="0.6" />

  <!-- Bear Snout Center Line & Mouth -->
  <path d="M 60 74 L 60 80 M 55 79 C 58 82 62 82 65 79" 
        stroke="#1e1b4b" 
        stroke-width="1.8" 
        stroke-linecap="round" />

  <!-- The "Den" Sanctuary Portal / Golden Hearth at the base of the Bear -->
  <!-- Represents Skuwikuwam ("Bear Den") - The Warm Protected Sanctuary Inside -->
  <path d="M 48 110 C 48 94 72 94 72 110 Z" 
        fill="url(#denSanctuaryGlow)" />
  <ellipse cx="60" cy="107" rx="9" ry="3" fill="#fbbf24" opacity="0.5" />
  <circle cx="60" cy="99" r="2.5" fill="#ffffff" />

  <!-- Mountain/Den Entrance Base Silhouette -->
  <path d="M 28 108 L 48 110 M 72 110 L 92 108" 
        stroke="#818cf8" 
        stroke-width="2" 
        stroke-linecap="round" 
        opacity="0.4" />
</svg>